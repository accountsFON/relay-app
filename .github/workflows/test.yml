name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate --schema=src/db/schema.prisma

      - run: npx tsc --noEmit

      # Unit tests only. The *.integration.test.ts suites need a real Postgres
      # and run in the separate `integration-tests` job below.
      - run: npm run test:unit

  schema-drift:
    # Guards against the "column does not exist" class of prod failure: catches
    # when src/db/schema.prisma has changed without a matching migration (the
    # Prisma client would then expect columns the DB never gets). Spins up a
    # throwaway Postgres, applies every migration with `migrate deploy` (the
    # same command prod uses — so this also proves the migrations apply cleanly),
    # then fails if the migrated database differs from schema.prisma.
    name: Schema drift check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate --schema=src/db/schema.prisma

      - name: Apply all migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Fail if schema.prisma has drifted from the migrations
        run: npx prisma migrate diff --from-config-datasource --to-schema src/db/schema.prisma --exit-code

  integration-tests:
    # The *.integration.test.ts suites hit a real Postgres via Prisma (unit
    # tests stub it). They include the DB-level tenant-isolation proofs
    # (e.g. cross-org findPostById returns null), so running them in CI turns
    # data-privacy guarantees into a merge gate instead of a local-only check.
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # test:integration migrates TEST_DATABASE_URL then runs vitest against it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relay_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate --schema=src/db/schema.prisma

      - name: Run integration tests against a real Postgres
        run: npm run test:integration

  detect-pipeline-changes:
    # Decide whether the Trigger.dev deploy needs to run. Skipped on PRs so
    # the deploy job below also skips. Output is consumed by deploy-trigger.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.changes.outputs.pipeline }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            pipeline:
              - 'src/server/jobs/**'
              - 'src/server/services/**'
              - 'src/server/prompts/**'
              - 'src/db/schema.prisma'
              - 'trigger.config.ts'
              - 'package.json'
              - 'package-lock.json'

  deploy-trigger:
    # Auto-deploy the Trigger.dev pipeline on push to main when any
    # pipeline-relevant file changed. Closes the manual `npx trigger.dev
    # deploy` gotcha that bit us 3 times in the launch-week sprint.
    # CLI version is pinned in the `trigger:deploy` script in package.json,
    # so this job and a local-dev run stay in lockstep automatically.
    name: Deploy Trigger.dev pipeline
    needs: [test, detect-pipeline-changes]
    # Auto-deploy on push to main when a pipeline file changed, OR on a manual
    # workflow_dispatch (to redeploy the pipeline on demand, e.g. when a change
    # landed before the path filter covered it). always() lets this evaluate
    # even though detect-pipeline-changes is skipped on workflow_dispatch.
    if: >-
      always() &&
      needs.test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.detect-pipeline-changes.outputs.pipeline == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate --schema=src/db/schema.prisma

      - run: npm run trigger:deploy
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
